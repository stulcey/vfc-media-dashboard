<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VFC Media Attribution Dashboard</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --surface-2: #f4f3ef;
    --text: #1f1f1f;
    --text-2: #5f5e5a;
    --text-3: #8a8884;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success: #0f6e56;
    --success-bg: #e1f5ee;
    --warning-bg: #faeeda;
    --warning-text: #854f0b;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #232323;
      --surface-2: #2a2a2a;
      --text: #f0efeb;
      --text-2: #b4b2a9;
      --text-3: #888780;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.18);
      --accent: #85b7eb;
      --accent-bg: rgba(133,183,235,0.12);
      --success: #5dcaa5;
      --success-bg: rgba(93,202,165,0.12);
      --warning-bg: rgba(250,199,117,0.15);
      --warning-text: #fac775;
      --danger-bg: rgba(240,149,149,0.15);
      --danger-text: #f09595;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { color: var(--text-2); font-size: 13px; margin: 0; }
  .controls { display: flex; gap: 8px; }
  .range-btn {
    background: transparent; border: 1px solid var(--border-strong); color: var(--text-2);
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .range-btn:hover { background: var(--surface-2); color: var(--text); }
  .range-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .stat-label { font-size: 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 500; color: var(--text); }
  .stat-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  h2 { font-size: 16px; font-weight: 500; margin: 32px 0 14px; color: var(--text); }
  h2 .count { color: var(--text-3); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .platform {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .platform:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .platform.expanded { grid-column: 1 / -1; cursor: default; }
  .p-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .p-name { font-size: 15px; font-weight: 500; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .p-revenue { font-size: 22px; font-weight: 500; margin: 0; }
  .p-meta { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .pill {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: var(--accent-bg); color: var(--accent); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .pill.muted { background: var(--surface-2); color: var(--text-2); }
  .bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .drilldown { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .drill-section { margin-bottom: 18px; }
  .drill-title { font-size: 12px; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .drill-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; gap: 12px; }
  .drill-row span:first-child { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drill-row span:last-child { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 12px; padding: 32px; text-align: center; color: var(--text-2); }
  .err { background: var(--danger-bg); color: var(--danger-text); padding: 16px; border-radius: 8px; margin: 16px 0; font-size: 13px; }
  .loading { color: var(--text-2); padding: 32px; text-align: center; }
  .updated { font-size: 11px; color: var(--text-3); margin-top: 12px; text-align: right; }
  .attribution-note { font-size: 11px; color: var(--text-3); margin-top: 8px; }
  .close-btn {
    background: transparent; border: 1px solid var(--border-strong); color: var(--text-2);
    padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .close-btn:hover { background: var(--surface-2); color: var(--text); }
  @media (max-width: 600px) {
    .wrap { padding: 20px 14px 40px; }
    header { flex-direction: column; align-items: flex-start; }
    h1 { font-size: 20px; }
    .stat-value { font-size: 20px; }
    .p-revenue { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Ventures Fly Co. — Media attribution</h1>
      <p class="subtitle">Revenue and opt-ins by acquisition platform</p>
    </div>
    <div class="controls" id="controls">
      <button class="range-btn active" data-range="30">30 days</button>
      <button class="range-btn" data-range="90">90 days</button>
      <button class="range-btn" data-range="qtd">QTD</button>
      <button class="range-btn" data-range="ytd">YTD</button>
    </div>
  </header>

  <div id="totals" class="totals"></div>
  <div id="content"><div class="loading">Loading attribution data…</div></div>
  <div id="updated" class="updated"></div>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vThmZJGW7Gc--pSHr1vwBeGfpTvOxxqLb1jNdolNxowT62k8HY6sYq3fGnESkv7cJVOQSIsJ99gNMgs/pub?gid=841032338&single=true&output=csv';

const RANGE_LABELS = { '30': 'last 30 days', '90': 'last 90 days', 'qtd': 'quarter to date', 'ytd': 'year to date' };
let currentRange = '30';
let currentData = null;
let expandedPlatform = null;

const fmtMoney = (n) => '$' + Math.round(n).toLocaleString();
const fmtNum = (n) => Math.round(n).toLocaleString();
const fmtPct = (n, total) => total > 0 ? Math.round((n / total) * 100) + '%' : '0%';

function parseCsvCells(csvText) {
  const lines = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < csvText.length; i++) {
    const ch = csvText[i];
    if (ch === '"') {
      if (inQuotes && csvText[i + 1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === '\n' && !inQuotes) {
      lines.push(current); current = '';
    } else if (ch === '\r' && !inQuotes) {
    } else {
      current += ch;
    }
  }
  if (current) lines.push(current);
  return lines;
}

async function loadData() {
  try {
    const res = await fetch(SHEET_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const cells = parseCsvCells(csv);
    const json = cells.join('');
    const payload = JSON.parse(json);
    currentData = payload;
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="err">Failed to load data: ' + e.message + '. The dashboard reads from a published Google Sheet — check the URL is correct and the sheet is published.</div>';
  }
}

function render() {
  if (!currentData) return;
  const data = currentData.ranges[currentRange];
  if (!data) {
    document.getElementById('content').innerHTML = '<div class="empty">No data for this range yet.</div>';
    return;
  }

  const creatorPlatforms = data.platforms.filter(p => p.is_creator_media && p.revenue > 0);
  const supportingChannels = data.platforms.filter(p => !p.is_creator_media && p.revenue > 0);
  const creatorRevenue = creatorPlatforms.reduce((s, p) => s + p.revenue, 0);
  const directRevenue = data.platforms.find(p => p.platform === 'Direct / Website')?.revenue || 0;
  const ownedRevenue = supportingChannels.filter(p => p.platform !== 'Direct / Website').reduce((s, p) => s + p.revenue, 0);
  const totalRevenue = data.totals.revenue;

  const directEmailRevenue = directRevenue + ownedRevenue;
  document.getElementById('totals').innerHTML = `
    <div class="stat" title="Every order placed in your Shopify store in this date range."><div class="stat-label">Total revenue</div><div class="stat-value">${fmtMoney(totalRevenue)}</div><div class="stat-sub">${fmtNum(data.totals.orders)} orders · ${RANGE_LABELS[currentRange]}</div></div>
    <div class="stat" title="Revenue we traced to YouTube, Podcast, Instagram, TikTok — orders from customers your content acquired."><div class="stat-label">Organic content</div><div class="stat-value">${fmtMoney(creatorRevenue)}</div><div class="stat-sub">${fmtPct(creatorRevenue, totalRevenue)} of revenue · YouTube, IG, Podcast, TikTok</div></div>
    <div class="stat" title="Revenue from email (Klaviyo, Shopify), Google Shopping free listings, and direct/untraceable orders. The untraceable portion is likely downstream effect of your content."><div class="stat-label">Direct / Email / Google</div><div class="stat-value">${fmtMoney(directEmailRevenue)}</div><div class="stat-sub">${fmtPct(directEmailRevenue, totalRevenue)} of revenue · email, Google, direct</div></div>
  `;

  const maxCreatorRev = Math.max(1, ...creatorPlatforms.map(p => p.revenue));
  const maxSuppRev = Math.max(1, ...supportingChannels.map(p => p.revenue));

  let html = '';
  if (creatorPlatforms.length > 0) {
    html += `<h2>Organic content <span class="count">revenue from YouTube, IG, Podcast, TikTok</span></h2><div class="platform-grid">`;
    creatorPlatforms.sort((a, b) => b.revenue - a.revenue).forEach(p => {
      html += platformCard(p, maxCreatorRev);
    });
    html += '</div>';
  } else {
    html += `<h2>Organic content</h2><div class="empty">No organic content revenue in this range.</div>`;
  }

  if (supportingChannels.length > 0) {
    html += `<h2>Supporting channels <span class="count">${supportingChannels.length} active</span></h2><div class="platform-grid">`;
    supportingChannels.sort((a, b) => b.revenue - a.revenue).forEach(p => {
      html += platformCard(p, maxSuppRev);
    });
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.platform').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.close-btn')) return;
      const name = el.dataset.platform;
      expandedPlatform = expandedPlatform === name ? null : name;
      render();
    });
  });

  const lu = new Date(currentData.last_updated);
  document.getElementById('updated').textContent =
    'Last refreshed: ' + lu.toLocaleString();
}

function platformCard(p, maxRev) {
  const isExpanded = expandedPlatform === p.platform;
  const barPct = Math.round((p.revenue / maxRev) * 100);
  const aov = p.orders > 0 ? p.revenue / p.orders : 0;
  const sources = p.attribution_sources || {};

  let inner = `
    <div class="p-header">
      <div style="flex:1; min-width:0;">
        <h3 class="p-name">${p.platform}</h3>
        <p class="p-revenue">${fmtMoney(p.revenue)}</p>
        <p class="p-meta">${fmtNum(p.orders)} orders · ${fmtMoney(aov)} avg ${p.optins > 0 ? '· ' + fmtNum(p.optins) + ' opt-ins' : ''}</p>
      </div>
      ${isExpanded ? '<button class="close-btn">Close</button>' : ''}
    </div>
    <div class="bar"><div class="bar-fill" style="width: ${barPct}%"></div></div>
  `;

  if (isExpanded) {
    inner += '<div class="drilldown">';
    if (p.mechanisms && p.mechanisms.length > 0) {
      inner += `<div class="drill-section"><div class="drill-title">By mechanism</div>`;
      p.mechanisms.filter(m => m.revenue > 0 || m.orders > 0).slice(0, 8).forEach(m => {
        inner += `<div class="drill-row"><span>${m.mechanism}</span><span>${fmtMoney(m.revenue)} · ${fmtNum(m.orders)} orders</span></div>`;
      });
      inner += '</div>';
    }
    if (p.campaigns && p.campaigns.length > 0) {
      const validCampaigns = p.campaigns.filter(c => c.campaign && c.campaign !== 'untagged' && (c.revenue > 0 || c.orders > 0));
      if (validCampaigns.length > 0) {
        inner += `<div class="drill-section"><div class="drill-title">Top campaigns / lead magnets</div>`;
        validCampaigns.slice(0, 8).forEach(c => {
          inner += `<div class="drill-row"><span>${c.campaign}</span><span>${fmtMoney(c.revenue)} · ${fmtNum(c.orders)} orders</span></div>`;
        });
        inner += '</div>';
      }
    }
    if (p.top_products && p.top_products.length > 0) {
      inner += `<div class="drill-section"><div class="drill-title">Top products</div>`;
      p.top_products.slice(0, 6).forEach(prod => {
        const truncated = prod.name.length > 60 ? prod.name.slice(0, 60) + '…' : prod.name;
        inner += `<div class="drill-row"><span title="${prod.name.replace(/"/g, '&quot;')}">${truncated}</span><span>${fmtNum(prod.count)}×</span></div>`;
      });
      inner += '</div>';
    }
    if (sources.segment || sources.utm || sources.utm_medium_override || sources.default) {
      const total = (sources.segment || 0) + (sources.utm || 0) + (sources.utm_medium_override || 0) + (sources.default || 0);
      inner += `<div class="attribution-note">Attribution sources: ${sources.segment || 0} from Klaviyo segment, ${(sources.utm || 0) + (sources.utm_medium_override || 0)} from UTM, ${sources.default || 0} default. Total: ${total}.</div>`;
    }
    inner += '</div>';
  }

  return `<div class="platform ${isExpanded ? 'expanded' : ''}" data-platform="${p.platform}">${inner}</div>`;
}

document.getElementById('controls').addEventListener('click', (e) => {
  if (e.target.classList.contains('range-btn')) {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentRange = e.target.dataset.range;
    expandedPlatform = null;
    render();
  }
});

loadData();
</script>
</body>
</html>
